[project]
name = "tcv-profile-reconstruction"
version = "0.1.0"
description = "TCV v7, v10, and v12 profile reconstruction models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.12",
  "matplotlib>=3.9",
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "polars>=1.22",
  "pyarrow>=21",
  "scikit-learn>=1.6",
  "scipy>=1.13,<1.14",
  "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lh_transitions"]

[tool.uv]
package = false
